name: Make Canary Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Source Code Download
      run: git clone --branch canary-next --single-branch --recurse-submodules https://github.com/midori01/PixelXpert.git .
      
    - name: JDK 21 Setup
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Gradlew Permissions
      run: chmod +x gradlew

    - name: Signature files preparation
      run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          fi
      
    - name: Gradle Build
      run: ./gradlew buildCanary -Pchannel=canary

    - name: Verify Output Artifact
      run: |
        mkdir -p output
        if [ ! -f output/PixelXpert.apk ]; then
          find app/build/outputs/apk -name "*.apk" -exec cp -f {} output/PixelXpert.apk \; || true
        fi
        ls -la output/

    - name: Shell Scripts Permissions
      run: chmod +x .github/*.sh

    - name: Changelog Generation
      run: .github/extractCanaryChanges.sh

    - name: Version Bump
      run: .github/prepareCanaryChangelog.sh ${{ github.run_id }}

    - name: Upload APK Artifact to Actions
      uses: actions/upload-artifact@v7.0.1
      with: 
        name: PixelXpert.apk
        path: output/PixelXpert.apk

    - name: Canary Binary Release
      uses: ncipollo/release-action@v1.21.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: 'canary_builds'
        name: 'Latest Canary'
        omitBodyDuringUpdate: true
        prerelease: false
        allowUpdates: true
        replacesArtifacts: true
        draft: false
        artifacts: 'output/*.apk'

    - name: Version Bump Commit
      uses: github-actions-x/commit@v2.9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push-branch: 'canary-next'
        commit-message: 'Version update: Release'
        force-add: 'true'
        files: version.properties latestVersion.json CanaryChangelog.md latestCanary.json
        name: midori01
        email: midori01@users.noreply.github.com
