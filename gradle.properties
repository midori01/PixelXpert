android.injected.testOnly=false
org.gradle.jvmargs=-Xmx1536M -Dkotlin.daemon.jvm.options\="-Xmx1536M" -Dfile.encoding\=UTF-8
android.useAndroidX=true
# compileSdk 37 is ahead of what AGP has been validated against; the build is green anyway.
android.suppressUnsupportedCompileSdk=37.0
android.nonTransitiveRClass=false
org.gradle.configuration-cache=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.dependency.excludeLibraryComponentsFromConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false

# KSP incremental scopes Resolver.getAllFiles() to changed files, so the mod-pack registry would be rewritten empty - green build, no hooks.
ksp.incremental=false
